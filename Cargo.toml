[package]
name = "stellargate"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

description = "A Rust toolkit for building on the Stellar blockchain"
repository = "https://github.com/StellarGateLabs/StellarGate"
license = "MIT"
keywords = ["stellar","blockchain","sdk","rpc"]
categories = ["network-programming", "command-line-utilities"]
# Application binary, not a library published to crates.io. `publish = false`
# lets cargo-deny skip it under `[licenses].private` rather than flagging the
# (intentionally unlicensed) workspace crate itself.
publish = false

[[bin]]
name = "stellargate"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "trace", "limit", "request-id", "timeout"] }
governor = "0.7"
moka = { version = "0.12", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "migrate"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
time = { version = "0.3", features = ["parsing"] }
# API key generation. Uses the OS CSPRNG — a UUIDv4 is random but only carries
# 122 bits and encodes a version/variant, so it is the wrong primitive for a
# bearer credential.
rand = "0.9"
# CIDR parsing for TRUSTED_PROXY_CIDRS (X-Forwarded-For trust boundary).
ipnet = "2"


[dev-dependencies]
axum-test = "15"
tokio = { version = "1", features = ["full"] }
time = { version = "0.3", features = ["parsing"] }
wiremock = "0.6.5"
# Captures `tracing` output per-test: audit-log tests assert on the fields a
# handler actually emitted (not just its HTTP response), and a config test
# asserts the plaintext-webhook startup warning is actually logged.
# `no-env-filter`: an integration test in tests/ compiles into its own crate,
# so tracing-test's default per-crate filter (which matches on *that* crate's
# name) would filter out every event actually emitted from the stellargate
# library.
tracing-test = { version = "0.2", features = ["no-env-filter"] }
