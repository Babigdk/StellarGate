name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-clippy:
    name: fmt / clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # RUSTUP_TOOLCHAIN takes precedence over rust-toolchain.toml, which would
      # otherwise pin this job to the MSRV and quietly ignore the toolchain
      # selected above.
      - name: Check formatting
        run: cargo fmt --check
        env:
          RUSTUP_TOOLCHAIN: stable

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        env:
          RUSTUP_TOOLCHAIN: stable

  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [1.88, stable]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust }}-

      # Without this the repo's rust-toolchain.toml would pin every matrix leg
      # to the MSRV, so the `stable` leg would silently retest 1.88 and report
      # a green check for a toolchain it never ran.
      - name: Test with locked dependencies
        run: cargo test --locked
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.rust }}

  openapi:
    name: openapi lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Lints the spec's shape (redocly.yaml extends `recommended`). The
      # complementary spec↔router cross-check — that documented paths actually
      # resolve and that the deprecated mount carries its headers — is the
      # `openapi_contract` integration test, which runs in the `test` job above.
      # Major pinned to match what the spec was validated against locally.
      - name: Lint openapi.yaml
        run: npx --yes @redocly/cli@1 lint openapi.yaml
